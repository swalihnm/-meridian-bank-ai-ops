# Defaults for the Meridian API chart. Secrets are NOT set here. The admin token comes from an
# existing Kubernetes Secret named by adminTokenSecret (create it outside the chart).
image:
  repository: meridian-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8000

adminTokenSecret: meridian-admin
adminTokenKey: admin-token

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
