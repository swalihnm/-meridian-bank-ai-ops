[project]
name = "meridian"
version = "0.0.1"
description = "AI-native customer operations platform for a synthetic digital bank"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# No importable package yet: services and ml folders are added as they are built.
[tool.setuptools]
packages = []

[project.optional-dependencies]
data = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pandera>=0.20",
]
ml = [
    "meridian[data]",
    "scikit-learn>=1.5",
    "datasets>=2.20",
    "transformers>=4.44",
    "torch>=2.4",
    "mlflow>=2.16",
    "rank-bm25>=0.2.2",
]
app = [
    "meridian[data]",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "mcp>=1.2,<2",
]
dev = [
    "meridian[data,ml,app]",
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["tests", "data", "services", "ml"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pandera.*", "mlflow.*", "transformers.*", "datasets.*", "rank_bm25.*", "sklearn.*", "torch.*", "shap.*", "lightgbm.*", "prometheus_client.*", "scipy.*", "kafka.*", "feast.*", "pyspark.*", "delta.*", "opentelemetry.*", "tensorflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
